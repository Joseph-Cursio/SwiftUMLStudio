name: CI

# Both jobs run on the standard GitHub-hosted `xcode-27` runner, which is free
# and unlimited because this repository is public. macOS minutes are billed if
# the repository goes private, and larger runners (such as xcode-27-xlarge)
# are billed even on a public one — check before changing either.
#
# `xcode-27` is a preview image (actions/runner-images#14404): the GA macOS
# images stop at Xcode 26.6 and Swift 6.3, and this project is developed on
# Xcode 27 and Swift 6.4. Move both jobs to the GA image that ships Xcode 27
# once there is one.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs of the same workflow on the same ref so PR pushes
# don't pile up, while letting pushes to main run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `pipefail` so failures in `xcodebuild | xcbeautify` aren't masked by
# xcbeautify's exit status. `errexit` is on by default for GitHub steps
# but be explicit so the intent is obvious.
defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  bridge:
    name: SwiftUMLBridge (CLI + framework)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # Pick the newest preinstalled Xcode that is not a beta. `latest-stable`
      # tracks the highest stable Xcode on the image: Xcode 27.2 (27B48, with
      # Swift 6.4.2) at the time of writing.
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM build artifacts
        uses: actions/cache@v5
        with:
          path: SwiftUMLBridge/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('SwiftUMLBridge/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve dependencies
        run: swift package --package-path SwiftUMLBridge resolve

      - name: Build
        run: swift build --package-path SwiftUMLBridge

      # TEMPORARY, for PR #224: on the runner this step has hung on every run
      # so far, printing nothing once the tests start, where locally the suite
      # passes in seconds. If `swift test` outlives `limit`, record what the
      # test process is doing, twice 20 s apart so a deadlock shows as the
      # same stacks, and fail instead of waiting for the job's timeout.
      - name: Test
        run: |
          swift test --package-path SwiftUMLBridge --enable-code-coverage &
          test_pid=$!
          limit=600
          for ((waited = 0; waited < limit; waited += 5)); do
            if ! kill -0 "$test_pid" 2>/dev/null; then
              wait "$test_pid"
              exit
            fi
            sleep 5
          done

          echo "::error::swift test was still running after ${limit}s; sampling it"
          mkdir -p hang-diagnostics
          sysctl hw.ncpu hw.memsize | tee hang-diagnostics/machine.txt
          top -l 1 -s 0 -n 15 -o cpu | tee hang-diagnostics/top.txt
          ps -axo pid,ppid,etime,%cpu,rss,command > hang-diagnostics/ps.txt
          grep -E 'swift|xctest|sourcekit|xcrun|git' hang-diagnostics/ps.txt || true
          for round in 1 2; do
            for pid in $(pgrep -f swiftpm-testing-helper); do
              sample "$pid" 5 -file "hang-diagnostics/sample-$pid-$round.txt" || true
            done
            if [ "$round" = 1 ]; then sleep 20; fi
          done
          for file in hang-diagnostics/sample-*-2.txt; do
            [ -f "$file" ] || continue
            echo "::group::$file: threads"
            grep -E '^ +[0-9]+ Thread_' "$file" || true
            echo "::endgroup::"
            echo "::group::$file: top of stack"
            sed -n '/Sort by top of stack/,/^$/p' "$file" | head -40 || true
            echo "::endgroup::"
          done
          pkill -f swiftpm-testing-helper || true
          kill "$test_pid" 2>/dev/null || true
          exit 1

      - name: Upload hang diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bridge-hang-diagnostics
          path: hang-diagnostics
          if-no-files-found: ignore

      - name: Smoke-test the CLI
        run: |
          swift run --package-path SwiftUMLBridge swiftumlbridge --version
          swift run --package-path SwiftUMLBridge swiftumlbridge --help

  studio:
    # The Studio app targets macOS 26.4+ (uses iOS-26 SwiftUI APIs), so its
    # tests need a runner on macOS 26 or later; `xcode-27` is macOS 27.
    name: SwiftUMLStudio (macOS app)
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      # The Xcode project signs with a development certificate from a
      # local team ID that the runner doesn't have. Disable signing for
      # CI builds — the binary is never distributed from here.
      - name: Build
        run: |
          xcodebuild \
            -scheme SwiftUMLStudio \
            -destination 'generic/platform=macOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build

      - name: Test
        run: |
          xcodebuild test \
            -scheme SwiftUMLStudio \
            -destination 'platform=macOS,arch=arm64' \
            -skipPackagePluginValidation \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: studio-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
