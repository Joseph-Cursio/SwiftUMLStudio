name: CI

# Both jobs run on the standard GitHub-hosted `xcode-27` runner, which is free
# and unlimited because this repository is public. macOS minutes are billed if
# the repository goes private, and larger runners (such as xcode-27-xlarge)
# are billed even on a public one — check before changing either.
#
# `xcode-27` is a preview image (actions/runner-images#14404): the GA macOS
# images stop at Xcode 26.6 and Swift 6.3, and this project is developed on
# Xcode 27 and Swift 6.4. Move both jobs to the GA image that ships Xcode 27
# once there is one.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs of the same workflow on the same ref so PR pushes
# don't pile up, while letting pushes to main run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `pipefail` so failures in `xcodebuild | xcbeautify` aren't masked by
# xcbeautify's exit status. `errexit` is on by default for GitHub steps
# but be explicit so the intent is obvious.
defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  bridge:
    name: SwiftUMLBridge (CLI + framework)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # Pick the newest preinstalled Xcode that is not a beta or release
      # candidate. `latest-stable` tracks the highest GM Xcode on the image:
      # Xcode 27.1 at the time of writing, beside a 27.2 release candidate.
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM build artifacts
        uses: actions/cache@v5
        with:
          path: SwiftUMLBridge/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('SwiftUMLBridge/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve dependencies
        run: swift package --package-path SwiftUMLBridge resolve

      - name: Build
        run: swift build --package-path SwiftUMLBridge

      - name: Test
        run: swift test --package-path SwiftUMLBridge --enable-code-coverage

      - name: Smoke-test the CLI
        run: |
          swift run --package-path SwiftUMLBridge swiftumlbridge --version
          swift run --package-path SwiftUMLBridge swiftumlbridge --help

  studio:
    # The Studio app targets macOS 26.4+ (uses iOS-26 SwiftUI APIs), so its
    # tests need a runner on macOS 26 or later; `xcode-27` is macOS 27.
    name: SwiftUMLStudio (macOS app)
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      # The Xcode project signs with a development certificate from a
      # local team ID that the runner doesn't have. Disable signing for
      # CI builds — the binary is never distributed from here.
      - name: Build
        run: |
          xcodebuild \
            -scheme SwiftUMLStudio \
            -destination 'generic/platform=macOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build

      - name: Test
        run: |
          xcodebuild test \
            -scheme SwiftUMLStudio \
            -destination 'platform=macOS,arch=arm64' \
            -skipPackagePluginValidation \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: studio-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
